<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="theme-color" id="theme-color-meta" content="#0056b3">
    <title>Caminho - Leitura da Lição</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="./assets/styles/tailwind.config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            display: inline-block;
            vertical-align: middle;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f2f2f7;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        .touch-target {
            min-height: 56px;
        }

        /* Dynamic Font Sizes */
        .font-size-pequeno { font-size: 14px; }
        .font-size-medio { font-size: 18px; }
        .font-size-grande { font-size: 22px; }
        .font-size-extra { font-size: 26px; }

        .active-scale:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
    </style>
</head>

<body class="flex flex-col min-h-screen font-body-md text-on-surface">
    <header class="bg-surface sticky top-0 z-50 flex justify-between items-center w-full px-margin-mobile h-touch-target-min border-b border-outline-variant">
        <button class="flex items-center gap-1 text-primary-container font-button-text active-scale transition-transform" onclick="window.history.back()">
            <span class="material-symbols-outlined">arrow_back</span>
            <span class="text-label-lg font-label-lg">Voltar</span>
        </button>
        <div class="w-10"></div> </header>

    <main class="flex-1 w-full max-w-lg mx-auto px-margin-mobile pt-8 pb-40">
        <h1 id="page-title" class="font-headline-lg-mobile text-headline-lg-mobile text-[#000000] mb-8 leading-tight dynamic-text">
            Carregando Estudo...
        </h1>
        
        <div id="content-container" class="space-y-8">
            </div>
    </main>
    
    <script src="./assets/js/dados.js"></script>
    <script src="./assets/js/acessibilidade.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderizarLicao();
        });

        function renderizarLicao() {
            // 1. Recupera as chaves salvas no localStorage (se não tiver, faz fallback para tiago/licao_1 para testes)
            const livroKey = localStorage.getItem('livro_selecionado') || 'tiago';
            const licaoKey = localStorage.getItem('licao_selecionada') || 'licao_1';

            // Validação de segurança
            if (typeof estudos === 'undefined' || !estudos[livroKey] || !estudos[livroKey].licoes[licaoKey]) {
                document.getElementById('content-container').innerHTML = '<p class="text-red-500">Erro: Dados da lição não encontrados.</p>';
                return;
            }

            const dadosLivro = estudos[livroKey];
            const dadosLicao = dadosLivro.licoes[licaoKey];

            // 2. Atualiza o Título Principal
            const nomeLivroLimpo = dadosLivro.nome_livro.replace('Estudos Bíblicos em Comunidade - ', '');
            document.getElementById('page-title').innerText = `${nomeLivroLimpo} - Lição ${dadosLicao.numero}: ${dadosLicao.titulo}`;

            const container = document.getElementById('content-container');
            let htmlContent = '';

            // Função helper para criar os cards com base na estrutura que você desenhou
            const buildCard = (titulo, texto, isHighlight = false) => {
                const borderClass = isHighlight ? 'border-l-4 border-l-primary-container' : '';
                const titleColor = isHighlight ? 'text-on-primary-fixed-variant' : 'text-primary-container';
                
                return `
                <section class="content-card opacity-0 translate-y-4 transition-all duration-700 ease-out bg-surface-container-lowest p-6 rounded-xl border border-outline-variant ${borderClass}">
                    <h2 class="font-headline-md text-headline-md ${titleColor} font-bold mb-4">
                        ${titulo}
                    </h2>
                    <p class="font-body-md text-body-md leading-loose text-on-surface dynamic-text">
                        ${texto}
                    </p>
                </section>`;
            };

            // Imagem padrão que você tinha no mockup para intercalar no conteúdo
            const imageAsset = `
            <div class="rounded-xl overflow-hidden content-card opacity-0 translate-y-4 transition-all duration-700 ease-out h-48 w-full bg-surface-container">
                <img class="w-full h-full object-cover" alt="Bíblia de Estudo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4Q3BWLiO6gvMnVgSj8VTovgrFazdW0Ddg7nlv83JYu7yQdqw3btCgQL9lIvCx-OsmrUB5H_Uytudq_2lqwI2AGfwDSwBxrOYqi65KoK5GK6TleyoSIJ46UmPypOOeH_c9Oqo-gvB0wcnvT-XSMk9dyakooOWigqzj4u0rl6R2HlzDHfU6_fDKri5GzN1gCCSlPKaTWBRm90AxgFU6HQp38Zse6bGGpkNin_6Bu_5FlZY24Ce7k7QWKmzKutuCUcYxsQHMPf3dm2Y">
            </div>`;

            // 3. Monta os blocos dinâmicos dependendo da estrutura da lição
            // Se for a Lição 1 (Conteúdo Integral)
            if (dadosLicao.conteudo_integral) {
                let index = 0;
                for (const [key, text] of Object.entries(dadosLicao.conteudo_integral)) {
                    // Formata a chave para um título legível (ex: o_autor_da_carta -> O Autor Da Carta)
                    let displayTitle = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    let isHighlight = false;

                    if (key === 'personalize_a_verdade') {
                        displayTitle = 'Personalize a VERDADE!';
                        isHighlight = true;
                    }

                    htmlContent += buildCard(displayTitle, text, isHighlight);

                    // Adiciona a imagem logo após o primeiro card (Introdução)
                    if (index === 0) htmlContent += imageAsset;
                    index++;
                }
            } 
            // Se forem as Lições 2 em diante (Comentários e Devocionais)
            else if (dadosLicao.devocionais_e_comentarios) {
                const dev = dadosLicao.devocionais_e_comentarios;
                
                htmlContent += imageAsset; // Coloca a imagem no topo para estas lições

                if (dev.aprenda_a_verdade) htmlContent += buildCard('Aprenda a VERDADE!', dev.aprenda_a_verdade, false);
                if (dev.pratique_a_verdade) htmlContent += buildCard('Pratique a VERDADE!', dev.pratique_a_verdade, false);
                if (dev.personalize_a_verdade) htmlContent += buildCard('Personalize a VERDADE!', dev.personalize_a_verdade, true);

                if (dev.comentario_integral) {
                    for (const [key, text] of Object.entries(dev.comentario_integral)) {
                        let displayTitle = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        htmlContent += buildCard(`Comentário: ${displayTitle}`, text, false);
                    }
                }
            }

            // Injeta no DOM
            container.innerHTML = htmlContent;

            // Aplica a acessibilidade (tamanho da fonte) se a função existir
            if (typeof sincronizarTamanhoFonte === 'function') {
                const tamanho = localStorage.getItem('caminho_tamanho_fonte') || 'medio';
                sincronizarTamanhoFonte(tamanho);
            }

            // 4. Configura o Observer para a animação de scroll (Fade In)
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('opacity-100', 'translate-y-0');
                        entry.target.classList.remove('opacity-0', 'translate-y-4');
                        observer.unobserve(entry.target); // Para de observar após animar
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.content-card').forEach(card => {
                observer.observe(card);
            });
        }
    </script>
</body>

</html>
